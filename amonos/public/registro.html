<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ámonos - Sign Up</title>
    <link rel="stylesheet" href="CSS/registro.css">
</head>
<body>

    <main class="login-wrapper">

        <section class="login-banner">
            <div class="banner-overlay">
                <h2>One country. A thousand experiences.</h2>
                <p>Discover the best tourist destinations in El Salvador</p>
            </div>
        </section>

        <section class="login-form-container">
            <header class="brand-header">
                <div class="logo-icon"></div>
                <h1 class="brand-name">Ámonos</h1>
                <p class="brand-tagline">One country. A thousand experiences.</p>
            </header>

            <h2 class="welcome-title">CREATE AN ACCOUNT</h2>
            <p class="welcome-subtitle">Sign up to start planning your next adventure</p>

            <div id="alertMessage" class="alert d-none" role="alert"></div>

            <form id="registerForm" class="login-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your first and last name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
                        <button type="button" class="btn-toggle-password" title="Show or hide password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 10px;">Sign Up</button>

                <div class="divider">
                    <span>or sign up with</span>
                </div>
            </form>

            <footer class="signup-prompt">
                <p>Already have an account? <a href="sesion.html" class="signup-link">Log in here</a></p>
            </footer>

        </section>

    </main>

    <script src="js/registro.js"></script>
</body>
</html>
