<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ámonos - Log In</title>
    <link rel="stylesheet" href="CSS/sesion.css">
</head>

<body>

    <main class="login-wrapper">

    <section class="login-form-container">
            <header class="brand-header">
                <div class="logo-icon"></div>
                <h1 class="brand-name">Ámonos</h1>
                <p class="brand-tagline">One country. A thousand experiences.</p>
            </header>

            <h2 class="welcome-title">WELCOME BACK!</h2>
            <p class="welcome-subtitle">Log in to your account to plan your next adventure</p>

            <div id="alertMessage" class="alert d-none" role="alert"></div>

            <form id="loginForm" class="login-form">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" placeholder="•••••••••••••" required>
                        <button type="button" class="btn-toggle-password" title="Show or hide password"></button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me on this device
                    </label>
                    <a href="recuperar.html" class="forgot-pass">Forgot your password?</a>
                </div>

                <button type="submit" class="btn-primary">Log In</button>

                <div class="divider">
                    <span>or continue with</span>
                </div>

            </form>

            <footer class="signup-prompt">
                <p>Don't have an account? <a href="registro.html" class="signup-link">Sign up here</a></p>
            </footer>

        </section>

    </main>

   <script src="js/login.js"></script>
</body>

</html>
