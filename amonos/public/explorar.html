<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ámonos - Explorar Paraísos</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/explorar.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo-container">
                    <img src="imagenes/descarga.png" alt="Ámonos Logo" class="logo-img">
                    <span class="logo-text">ÁMONOS</span>
                </a>
                <ul class="menu-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="explorar.html" class="active">Explorar destinos</a></li>
                    <li><a href="planificador.html">Planificador</a></li>
                    <li><a href="perfil.html">Perfil</a></li>
                </ul>
                <a href="perfil.html" class="avatar" title="Mi Perfil">D</a>
            </nav>
        </div>
    </header>

    <main class="explore-wrapper">
        <section class="explore-hero">
            <div class="hero-content">
                <h1>Encuentra tu próximo <span class="highlight">destino</span></h1>
                <p>Descubre los rincones más mágicos de El Salvador</p>
            </div>
        </section>

        <div class="container main-layout">
            <aside class="sidebar-filters">
                <div class="filter-card">
                    <div class="filter-header">
                        <i class="fa-solid fa-sliders"></i>
                        <h3>Filtros Rápidos</h3>
                    </div>

                    <div class="filter-section">
                        <label class="filter-label">Buscar destino</label>
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchInput" placeholder="Ej: Volcán, Playa...">
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-label">Categoría</label>
                        <div class="chips-container" id="categoryChips">
                            <span class="chip active" data-category="todos">Todos</span>
                            <span class="chip" data-category="aventura">Aventura</span>
                            <span class="chip" data-category="playa">Playa</span>
                            <span class="chip" data-category="cultural">Cultural</span>
                            <span class="chip" data-category="gastronomico">Gastronómico</span>
                            <span class="chip" data-category="montana">Montaña</span>
                        </div>
                    </div>

                    <div class="filter-section">
                        <label class="filter-label">Presupuesto Diario</label>
                        <div class="budget-options">
                            <label class="budget-item">
                                <input type="checkbox" class="budget-filter" value="economico" checked>
                                <span class="checkmark"></span>
                                <span class="label-text">Económico (< $20)</span>
                            </label>
                            <label class="budget-item">
                                <input type="checkbox" class="budget-filter" value="conforme" checked>
                                <span class="checkmark"></span>
                                <span class="label-text">Conforme ($20 - $50)</span>
                            </label>
                            <label class="budget-item">
                                <input type="checkbox" class="budget-filter" value="premium" checked>
                                <span class="checkmark"></span>
                                <span class="label-text">Premium (> $50)</span>
                            </label>
                        </div>
                    </div>

                    <button id="resetFilters" class="btn-reset">Limpiar Filtros</button>
                </div>
            </aside>

            <section class="results-area">
                <div class="results-info">
                    <span id="resultsCount">Cargando destinos...</span>
                    <div class="sort-options">
                        <span>Ordenar por:</span>
                        <select id="sortSelect">
                            <option value="desc">Más Recientes</option>
                            <option value="rating">Mejor Calificados</option>
                            <option value="price_asc">Precio: Menor a Mayor</option>
                            <option value="price_desc">Precio: Mayor a Menor</option>
                        </select>
                    </div>
                </div>

                <div class="cards-grid" id="cardsGrid">
                    <!-- Destinos inyectados por JS -->
                </div>
            </section>
        </div>
    </main>

    <script src="js/explorar.js"></script>
</body>
</html>
